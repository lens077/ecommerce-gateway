# 网关。环境变量与 `make dev` 逐项对齐。
#
# 前置:
#   docker network create ecommerce
#   docker login ccr.ccs.tencentyun.com
#
# 必须接在 ecommerce 网络里:后端容器注册进 Consul 的是网桥内的 172.x 地址,
# 网关不在同一网络就 discovery 得到节点也连不上。
#
# POLICIES_FILE_PATH / MODEL_FILE_PATH 是「落盘目的地」而不是数据源；
# 网关从 Config Center 拉取并热更新后再交给 Casbin。

services:

  ecommerce-gateway:
    image: ccr.ccs.tencentyun.com/sumery/ecommerce-gateway:latest
    container_name: ecommerce-gateway
    # 改本地代码后想验证,把上面的 image 换成任意本地 tag 并打开下面两行
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    pull_policy: always
    networks:
      - ecommerce
    ports:
      - "8080:8080"
    environment:
      - OWNER=ecommerce
      - CASDOOR_URL=https://casdoor.apikv.com
      - SERVICE_NAME=ecommerce-gateway
      - CONFIG_SOURCE_FILE=/etc/ecommerce/config-source/gateway.yaml
      # Consul 只用于服务发现。
      - CONSUL_ADDR=consul://192.168.3.112:8500
      - POLICIES_FILE_PATH=./configs/policies/policies.csv
      - MODEL_FILE_PATH=./configs/policies/model.conf
      - USE_TLS=false
      - USE_HTTP3=false
      - HTTP_PORT=8080
    volumes:
      - ./configs/source.dev.yaml:/etc/ecommerce/config-source/gateway.yaml:ro
    restart: on-failure:3

networks:
  ecommerce:
    external: true
