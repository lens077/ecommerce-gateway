apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-gateway-config
data:
  OWNER: "ecommerce"
  CASDOOR_URL: "https://apikv.com:8081"
  CONSUL_ADDR: "consul://apikv.com:8500"
  POLICIES_FILE_PATH: "./configs/policies/policies.csv"
  MODEL_FILE_PATH: "./configs/policies/model.conf"
  USE_TLS: "false"
  USE_HTTP3: "false"
  HTTP_PORT: "8080"
  CONSUL_SCHEME: "https"
  CONSUL_INSECURE_SKIP_VERIFY: "true"
